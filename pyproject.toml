[build-system]
requires = ["setuptools>=61", "wheel", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "enet"
version = "0.0.1"
description = "Sparse ElasticNet solver from scratch (learning / portfolio artifact)"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "scipy>=1.9"]

[project.optional-dependencies]
test = ["pytest>=7", "scikit-learn>=1.2"]
bench = ["matplotlib>=3.8", "scikit-learn>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
